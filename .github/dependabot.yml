version: 2
updates:
  # The starter has no dependencies by design, so this watches the one thing that
  # can actually drift: the actions used by CI. Pinned action versions go stale
  # quietly and are a real supply-chain surface.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
